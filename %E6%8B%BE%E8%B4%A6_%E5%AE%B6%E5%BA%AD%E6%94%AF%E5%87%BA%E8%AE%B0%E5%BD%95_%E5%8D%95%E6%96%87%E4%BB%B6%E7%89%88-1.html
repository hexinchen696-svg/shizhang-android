<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b55">
<meta name="description" content="简洁、私密的家庭月支出记录工具">
<link rel="manifest" href="manifest.json">
<title>拾账 · 家庭账本</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#172b25;--muted:#7b8b84;--line:#e6ece8;--green:#176b55;--green2:#e2f3eb;--red:#d95b50;--amber:#c68b32;--shadow:0 8px 26px rgba(31,65,49,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;padding-bottom:88px}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a5d8c5;outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:0 16px}.top{padding:20px 2px 14px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:21px;font-weight:800}.brand h1{font-size:20px;margin:0;letter-spacing:.3px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.iconbtn{width:40px;height:40px;border-radius:14px;background:#fff;color:var(--green);box-shadow:var(--shadow);font-size:18px}
.tabs{display:flex;gap:5px;background:#e9efeb;padding:4px;border-radius:15px;margin:4px 0 16px}.tab{flex:1;padding:11px 5px;border-radius:11px;background:transparent;color:#718078;font-weight:650}.tab.active{background:#fff;color:var(--green);box-shadow:0 2px 8px #203e3010}
.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#145d4a,#23836a);border-radius:24px;padding:22px;color:white;box-shadow:0 12px 30px #176b5522;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;border:28px solid #ffffff0c;right:-58px;top:-72px}.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}.hero label{color:#d1e9df;font-size:12px}.monthpick{border:1px solid #ffffff44;background:#ffffff12;color:white;border-radius:10px;padding:8px 9px;max-width:155px}.monthpick::-webkit-calendar-picker-indicator{filter:invert(1)}.amount{font-size:36px;letter-spacing:-1px;font-weight:760;margin:13px 0 18px;position:relative;z-index:1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}.stat{background:#ffffff14;border:1px solid #ffffff17;border-radius:15px;padding:12px}.stat small{color:#d1e9df;display:block;margin-bottom:6px}.stat strong{font-size:16px}.progress{height:6px;border-radius:99px;background:#ffffff2b;margin-top:13px;overflow:hidden}.progress span{display:block;height:100%;background:#d2f1df;border-radius:99px;width:0}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}.sectionhead h2{font-size:16px;margin:0}.subtle{color:var(--muted);font-size:12px}.textbtn{background:transparent;color:var(--green);font-weight:700;padding:6px}
.quickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick{background:var(--card);border-radius:17px;padding:13px 5px;text-align:center;box-shadow:var(--shadow);color:var(--ink)}.quick .emoji{display:grid;place-items:center;width:43px;height:43px;border-radius:15px;background:var(--green2);margin:0 auto 8px;font-size:21px}.quick span{font-size:12px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:13px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.category-icon{width:44px;height:44px;border-radius:15px;background:#f0f4f1;display:grid;place-items:center;font-size:21px;flex-shrink:0}.entry-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-meta{font-size:12px;color:var(--muted);margin-top:5px}.entry-amount{font-size:15px;font-weight:750;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:28px 10px}.empty .emoji{font-size:30px;margin-bottom:8px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}.navinner{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.navitem{background:transparent;color:#819087;padding:7px 2px 4px;border-radius:12px;display:flex;align-items:center;flex-direction:column;gap:4px;font-size:11px}.navitem b{font-size:20px;font-weight:500}.navitem.active{color:var(--green);background:#eaf5ef;font-weight:700}
.primary{background:var(--green);color:white;border-radius:13px;padding:13px 16px;font-weight:750}.secondary{background:var(--green2);color:var(--green);border-radius:12px;padding:11px 14px;font-weight:700}.danger{background:#fff0ee;color:var(--red);border-radius:12px;padding:10px 12px;font-weight:700}.full{width:100%}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.fullrow{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea,.filterinput{width:100%;border:1px solid var(--line);background:#fbfcfb;border-radius:12px;padding:12px;color:var(--ink);min-width:0}.field textarea{resize:vertical;min-height:70px}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select,.toolbar input{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;min-width:0}.toolbar input{flex:1;min-width:120px}
.piearea{display:flex;align-items:center;gap:20px}.donut{width:145px;height:145px;flex-shrink:0}.legend{flex:1;min-width:0}.legendrow{display:flex;align-items:center;gap:7px;margin:10px 0;font-size:12px}.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}.legendrow .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.legendrow strong{white-space:nowrap}
.budgetrow{padding:13px 0;border-bottom:1px solid var(--line)}.budgetrow:last-child{border:0}.budgetmeta{display:flex;justify-content:space-between;gap:8px;margin-bottom:9px}.bar{height:7px;border-radius:99px;background:#edf1ee;overflow:hidden}.bar span{height:100%;display:block;border-radius:99px;background:var(--green)}.bar span.over{background:var(--red)}
.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.yearmonth{background:#f7faf8;border-radius:13px;padding:12px 9px}.yearmonth small{color:var(--muted)}.yearmonth strong{display:block;margin-top:7px;font-size:14px}
.modalback{position:fixed;inset:0;background:#10231bb3;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}.modalback.show{display:flex}.modal{background:var(--bg);width:100%;max-width:760px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 17px calc(22px + env(safe-area-inset-bottom))}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.modalhead h2{margin:0;font-size:19px}.close{width:35px;height:35px;border-radius:12px;background:#e9efeb;color:var(--ink);font-size:20px}.settingsnote{background:#f0f5f1;padding:13px;border-radius:13px;color:#53665c;line-height:1.65;font-size:12px}
@media(min-width:600px){.app{padding:0 24px}.hero{padding:25px}.amount{font-size:42px}.modalback{align-items:center;padding:18px}.modal{border-radius:24px;max-height:88dvh}.quickgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:360px){.app{padding:0 11px}.hero{padding:17px}.amount{font-size:31px}.quickgrid{gap:6px}.quick{padding:10px 2px}.piearea{gap:10px}.donut{width:115px;height:115px}.formgrid{grid-template-columns:1fr}.field.fullrow{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">拾</div><div><h1>拾账</h1><p>把每一笔生活，都记得清楚</p></div></div>
  <button class="iconbtn" id="settingsBtn" aria-label="设置">⚙</button>
</header>
<nav class="tabs" aria-label="主要页面">
  <button class="tab active" data-page="home">总览</button><button class="tab" data-page="records">账单</button><button class="tab" data-page="stats">报表</button><button class="tab" data-page="budget">预算</button>
</nav>
<main>
<section class="page active" id="page-home">
  <div class="hero">
    <div class="hero-top"><label>本月总支出</label><input id="homeMonth" class="monthpick" type="month"></div>
    <div class="amount" id="homeTotal">¥0.00</div>
    <div class="stats"><div class="stat"><small>本月收入</small><strong id="homeIncome">¥0.00</strong></div><div class="stat"><small>本月结余</small><strong id="homeBalance">¥0.00</strong></div></div>
    <div class="progress"><span id="homeProgress"></span></div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#d1e9df"><span id="budgetCaption">月预算尚未设置</span><span id="budgetPercent">—</span></div>
  </div>
  <div class="sectionhead"><h2>快速记一笔</h2><span class="subtle">选择类型开始</span></div>
  <div class="quickgrid">
    <button class="quick" data-quick="餐饮食品"><div class="emoji">🍜</div><span>餐饮食品</span></button>
    <button class="quick" data-quick="交通出行"><div class="emoji">🚗</div><span>交通出行</span></button>
    <button class="quick" data-quick="居家生活"><div class="emoji">🏠</div><span>居家生活</span></button>
    <button class="quick" data-quick="购物消费"><div class="emoji">🛍️</div><span>购物消费</span></button>
  </div>
  <div class="sectionhead"><h2>最近记录</h2><button class="textbtn" data-goto="records">查看全部 →</button></div>
  <div id="recentList"></div>
  <button class="primary full" id="addExpenseHome" style="margin-top:8px">＋ 记一笔</button>
</section>
<section class="page" id="page-records">
  <div class="sectionhead" style="margin-top:4px"><h2>全部账单</h2><button class="primary" id="addRecordBtn" style="padding:10px 13px">＋ 记一笔</button></div>
  <div class="toolbar" style="margin-bottom:12px"><input id="recordSearch" placeholder="搜索备注或类别"><input id="recordMonth" type="month" aria-label="筛选月份"><select id="recordType"><option value="all">全部类型</option><option value="expense">支出</option><option value="income">收入</option></select></div>
  <div id="recordList"></div>
</section>
<section class="page" id="page-stats">
  <div class="sectionhead" style="margin-top:4px"><h2>收支报表</h2><select id="statsYear" aria-label="统计年份" style="border:1px solid var(--line);padding:8px 10px;border-radius:10px;background:#fff"></select></div>
  <div class="card"><div class="subtle">年度总支出</div><div id="yearTotal" style="font-size:28px;font-weight:800;margin:7px 0">¥0.00</div><div class="row" style="justify-content:space-between"><span class="subtle">年度收入</span><strong id="yearIncome">¥0.00</strong></div><div class="row" style="justify-content:space-between;margin-top:8px"><span class="subtle">年度结余</span><strong id="yearBalance">¥0.00</strong></div></div>
  <div class="card"><div class="sectionhead" style="margin:0 0 14px"><h2>支出分类</h2><span class="subtle">所选年份</span></div><div class="piearea"><svg id="donut" class="donut" viewBox="0 0 160 160" role="img" aria-label="支出分类环形图"></svg><div class="legend" id="legend"></div></div></div>
  <div class="card"><div class="sectionhead" style="margin:0 0 12px"><h2>每月支出</h2><span class="subtle">1—12月</span></div><div id="yearMonths" class="yeargrid"></div></div>
  <div class="card"><div class="sectionhead" style="margin:0 0 12px"><h2>分类明细</h2></div><div id="categoryStats"></div></div>
</section>
<section class="page" id="page-budget">
  <div class="sectionhead" style="margin-top:4px"><h2>预算管理</h2><button class="secondary" id="editBudgetBtn">设置预算</button></div>
  <div class="card"><div class="subtle">本月总预算</div><div id="budgetTotalLabel" style="font-size:30px;font-weight:800;margin:7px 0">¥0.00</div><div class="row" style="justify-content:space-between"><span class="subtle">已使用</span><strong id="budgetUsedLabel">¥0.00</strong></div><div class="bar" style="margin-top:12px"><span id="budgetBar"></span></div><div class="row" style="justify-content:space-between;margin-top:8px"><span class="subtle">剩余预算</span><strong id="budgetLeftLabel">¥0.00</strong></div></div>
  <div class="sectionhead"><h2>分类预算</h2><span class="subtle">可分别设置上限</span></div>
  <div class="card" id="categoryBudgets"></div>
  <div class="settingsnote">预算仅用于提醒和复盘，不会限制你继续记账。分类预算为可选项，未设置的类别仍会正常统计。</div>
</section>
</main>
</div>
<div class="bottomnav"><div class="navinner">
<button class="navitem active" data-page="home"><b>⌂</b>总览</button><button class="navitem" data-page="records"><b>▤</b>账单</button><button class="navitem" data-page="stats"><b>◔</b>报表</button><button class="navitem" data-page="budget"><b>◎</b>预算</button>
</div></div>
<div class="modalback" id="modalBack"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">记一笔</h2><button class="close" id="closeModal" aria-label="关闭">×</button></div><div id="modalBody"></div></div></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
const CATS={
'餐饮食品':{icon:'🍜',color:'#23866c'},'居家生活':{icon:'🏠',color:'#5b9bd5'},'交通出行':{icon:'🚗',color:'#e4a34c'},'购物消费':{icon:'🛍️',color:'#d97887'},'水电物业':{icon:'💡',color:'#8c78cf'},'医疗健康':{icon:'💊',color:'#5ba9a4'},'娱乐休闲':{icon:'🎬',color:'#d79b50'},'教育学习':{icon:'📚',color:'#7294c9'},'人情往来':{icon:'🎁',color:'#c879b0'},'住房支出':{icon:'🏡',color:'#8d9d65'},'其他支出':{icon:'📦',color:'#91a19a'},'工资收入':{icon:'💼',color:'#23866c'},'其他收入':{icon:'＋',color:'#5b9bd5'}
};
const EXPENSE_CATS=Object.keys(CATS).filter(x=>!x.includes('收入')),INCOME_CATS=['工资收入','其他收入'];
const STORE='shizhang_records_v1',BUDGET='shizhang_budget_v1';
let records=[],budget={total:6000,cats:{}},editingId=null,quickCategory=null;
const $=id=>document.getElementById(id);
const now=new Date(),monthStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,todayStr=()=>`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const money=n=>'¥'+(Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{records=JSON.parse(localStorage.getItem(STORE)||'[]');if(!Array.isArray(records))records=[]}catch{records=[]}try{budget={total:6000,cats:{},...JSON.parse(localStorage.getItem(BUDGET)||'{}')}}catch{budget={total:6000,cats:{}}}}
function save(){localStorage.setItem(STORE,JSON.stringify(records));localStorage.setItem(BUDGET,JSON.stringify(budget))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function sum(arr,type){return arr.filter(r=>!type||r.type===type).reduce((s,r)=>s+Number(r.amount||0),0)}
function inMonth(r,m){return r.date&&r.date.slice(0,7)===m}
function monthly(m){return records.filter(r=>inMonth(r,m))}
function el(tag,cls,html){let e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function entryHtml(r,actions=true){let c=CATS[r.category]||CATS['其他支出'];return `<div class="card" style="padding:13px 14px;margin-bottom:9px"><div class="row"><div class="category-icon">${c.icon}</div><div class="grow"><div class="entry-title">${esc(r.note||r.category)}</div><div class="entry-meta">${esc(r.date)} · ${esc(r.category)}${r.type==='income'?' · 收入':''}</div></div><div style="text-align:right"><div class="entry-amount" style="color:${r.type==='income'?'var(--green)':'var(--ink)'}">${r.type==='income'?'+':'−'}${money(r.amount)}</div>${actions?`<div style="display:flex;gap:4px;justify-content:flex-end;margin-top:7px"><button class="textbtn" data-edit="${r.id}" style="font-size:12px;padding:2px 4px">编辑</button><button class="textbtn" data-delete="${r.id}" style="font-size:12px;padding:2px 4px;color:var(--red)">删除</button></div>`:''}</div></div></div>`}
function empty(msg='还没有记录'){return `<div class="card empty"><div class="emoji">🧾</div><div>${msg}</div><div class="subtle" style="margin-top:6px">记下第一笔，月底就有清晰报表</div></div>`}
function renderHome(){let m=$('homeMonth').value||monthStr(now),rs=monthly(m),ex=sum(rs,'expense'),inc=sum(rs,'income'),bal=inc-ex,used=budget.total>0?ex/budget.total*100:0;
$('homeTotal').textContent=money(ex);$('homeIncome').textContent=money(inc);$('homeBalance').textContent=money(bal);$('homeProgress').style.width=Math.min(100,used)+'%';$('budgetCaption').textContent=budget.total>0?`月预算 ${money(budget.total)}`:'月预算尚未设置';$('budgetPercent').textContent=budget.total>0?`${Math.round(used)}% 已使用`:'—';
$('recentList').innerHTML=rs.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0)).slice(0,5).map(r=>entryHtml(r,false)).join('')||empty('本月还没有账目');}
function renderRecords(){let m=$('recordMonth').value,typ=$('recordType').value,q=$('recordSearch').value.trim().toLowerCase();let rs=[...records].filter(r=>(!m||inMonth(r,m))&&(typ==='all'||r.type===typ)&&(!q||(r.note+' '+r.category).toLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));$('recordList').innerHTML=rs.map(r=>entryHtml(r,true)).join('')||empty('没有符合条件的账单');}
function renderStats(){let y=Number($('statsYear').value)||now.getFullYear(),rs=records.filter(r=>r.date&&Number(r.date.slice(0,4))===y),ex=sum(rs,'expense'),inc=sum(rs,'income');$('yearTotal').textContent=money(ex);$('yearIncome').textContent=money(inc);$('yearBalance').textContent=money(inc-ex);
let map={};rs.filter(r=>r.type==='expense').forEach(r=>map[r.category]=(map[r.category]||0)+Number(r.amount));let items=Object.entries(map).sort((a,b)=>b[1]-a[1]),colors=items.map(([c])=>(CATS[c]||CATS['其他支出']).color),total=items.reduce((s,x)=>s+x[1],0);let svg=$('donut');svg.innerHTML='';if(!total){svg.innerHTML='<circle cx="80" cy="80" r="56" fill="none" stroke="#e8eeea" stroke-width="24"/><text x="80" y="77" text-anchor="middle" font-size="12" fill="#7b8b84">暂无数据</text><text x="80" y="94" text-anchor="middle" font-size="10" fill="#7b8b84">支出分类</text>'}else{let start=-Math.PI/2;items.forEach(([c,v],i)=>{let a=v/total*Math.PI*2,x1=80+56*Math.cos(start),y1=80+56*Math.sin(start),end=start+a,x2=80+56*Math.cos(end),y2=80+56*Math.sin(end),large=a>Math.PI?1:0;let p=el('path');p.setAttribute('d',`M ${x1} ${y1} A 56 56 0 ${large} 1 ${x2} ${y2}`);p.setAttribute('fill','none');p.setAttribute('stroke',colors[i]);p.setAttribute('stroke-width','24');p.setAttribute('stroke-linecap','butt');svg.appendChild(p);start=end});svg.innerHTML+=`<text x="80" y="76" text-anchor="middle" font-size="11" fill="#7b8b84">总支出</text><text x="80" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#172b25">${total>=10000?(total/10000).toFixed(1)+'万':Math.round(total)}</text>`}
$('legend').innerHTML=items.slice(0,6).map(([c,v],i)=>`<div class="legendrow"><span class="dot" style="background:${colors[i]}"></span><span class="name">${esc(c)}</span><strong>${Math.round(v/total*100)}%</strong></div>`).join('')||'<div class="subtle">添加支出后自动生成</div>';
$('yearMonths').innerHTML=Array.from({length:12},(_,i)=>{let m=`${y}-${String(i+1).padStart(2,'0')}`,v=sum(records.filter(r=>inMonth(r,m)),'expense');return `<div class="yearmonth"><small>${i+1}月</small><strong>${money(v)}</strong></div>`}).join('');
$('categoryStats').innerHTML=items.map(([c,v])=>`<div class="budgetrow"><div class="budgetmeta"><span>${(CATS[c]||{}).icon||'📦'} ${esc(c)}</span><strong>${money(v)}</strong></div><div class="bar"><span style="width:${total?v/total*100:0}%;background:${(CATS[c]||CATS['其他支出']).color}"></span></div></div>`).join('')||'<div class="empty">暂无分类统计</div>';}
function renderBudget(){let m=$('homeMonth').value||monthStr(now),ex=sum(monthly(m),'expense'),left=budget.total-ex,pct=budget.total>0?ex/budget.total*100:0;$('budgetTotalLabel').textContent=money(budget.total);$('budgetUsedLabel').textContent=money(ex);$('budgetLeftLabel').textContent=money(left);$('budgetBar').style.width=Math.min(100,pct)+'%';$('budgetBar').classList.toggle('over',pct>100);
let map={};monthly(m).filter(r=>r.type==='expense').forEach(r=>map[r.category]=(map[r.category]||0)+Number(r.amount));$('categoryBudgets').innerHTML=EXPENSE_CATS.map(c=>{let b=Number(budget.cats?.[c]||0),v=map[c]||0;return `<div class="budgetrow"><div class="budgetmeta"><span>${CATS[c].icon} ${c}</span><strong>${money(v)}${b?` / ${money(b)}`:''}</strong></div>${b?`<div class="bar"><span class="${v>b?'over':''}" style="width:${Math.min(100,v/b*100)}%"></span></div><div class="subtle" style="margin-top:6px">${v>b?'已超出 '+money(v-b):'剩余 '+money(b-v)}</div>`:'<div class="subtle">未设置分类预算</div>'}</div>`}).join('');}
function render(){renderHome();renderRecords();renderStats();renderBudget()}
function showPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+name));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===name));window.scrollTo({top:0,behavior:'smooth'});}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalBack').classList.add('show')}
function closeModal(){$('modalBack').classList.remove('show');editingId=null;quickCategory=null}
function recordForm(existing={},preset){let type=existing.type||'expense',cat=existing.category||preset||(type==='expense'?'餐饮食品':'工资收入');return `<form id="recordForm"><div class="formgrid"><div class="field fullrow"><label>账目类型</label><select name="type" id="formType"><option value="expense" ${type==='expense'?'selected':''}>支出</option><option value="income" ${type==='income'?'selected':''}>收入</option></select></div><div class="field fullrow"><label>金额（元）</label><input name="amount" inputmode="decimal" type="number" min="0.01" step="0.01" placeholder="例如：36.50" value="${existing.amount??''}" required></div><div class="field"><label>类别</label><select name="category" id="formCategory">${(type==='income'?INCOME_CATS:EXPENSE_CATS).map(c=>`<option ${cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>日期</label><input name="date" type="date" value="${existing.date||todayStr()}" required></div><div class="field fullrow"><label>备注（选填）</label><input name="note" maxlength="80" placeholder="例如：超市买菜、午餐" value="${esc(existing.note||'')}"></div></div><div class="actions"><button type="button" class="secondary" id="cancelForm">取消</button><button type="submit" class="primary">保存记录</button></div></form>`}
function openRecord(preset=null,existing=null){editingId=existing?.id||null;openModal(existing?'编辑账目':'记一笔',recordForm(existing||{},preset));$('cancelForm').onclick=closeModal;$('formType').onchange=e=>{let list=e.target.value==='income'?INCOME_CATS:EXPENSE_CATS;$('formCategory').innerHTML=list.map(c=>`<option>${c}</option>`).join('')};$('recordForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),amount=Number(fd.get('amount'));if(!Number.isFinite(amount)||amount<=0){alert('请输入大于 0 的金额');return}let r={id:editingId||id(),type:fd.get('type'),amount:Math.round(amount*100)/100,category:fd.get('category'),date:fd.get('date'),note:fd.get('note').trim(),created:existing?.created||Date.now()};if(editingId)records=records.map(x=>x.id===editingId?r:x);else records.push(r);save();closeModal();render();};}
function openBudget(){let cats=EXPENSE_CATS.map(c=>`<div class="field"><label>${CATS[c].icon} ${c}预算（元）</label><input type="number" min="0" step="0.01" name="cat_${c}" value="${budget.cats?.[c]||''}" placeholder="不设置请留空"></div>`).join('');openModal('设置预算',`<form id="budgetForm"><div class="field" style="margin-bottom:14px"><label>每月总预算（元）</label><input name="total" type="number" min="0" step="0.01" value="${budget.total||''}" placeholder="例如：6000"></div><div class="formgrid">${cats}</div><div class="actions"><button type="button" class="secondary" id="cancelForm">取消</button><button class="primary" type="submit">保存预算</button></div></form>`);$('cancelForm').onclick=closeModal;$('budgetForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target);budget.total=Math.max(0,Number(fd.get('total'))||0);budget.cats={};EXPENSE_CATS.forEach(c=>{let v=Number(fd.get('cat_'+c));if(v>0)budget.cats[c]=v});save();closeModal();render()}}
function openSettings(){openModal('数据与设置',`<div class="card"><div style="font-weight:750;margin-bottom:7px">数据备份</div><div class="subtle" style="line-height:1.6">账目默认保存在当前浏览器的本机存储中。定期导出备份，清除浏览器数据或更换设备前请先备份。</div><div class="actions"><button class="secondary" id="exportJson">导出完整备份</button><button class="secondary" id="importJson">导入备份</button></div></div><div class="card"><div style="font-weight:750;margin-bottom:7px">导出表格</div><div class="subtle">导出全部账目为 CSV，可用 Excel 或表格软件打开。</div><button class="primary full" id="exportCsv" style="margin-top:12px">导出 CSV 账单</button></div><div class="settingsnote">隐私说明：此版本不会自动连接银行账户，也不会将账目上传到服务器。请妥善保管备份文件。</div><div style="margin-top:14px"><button class="danger full" id="clearAll">清空全部账目</button></div>`);$('exportJson').onclick=exportJSON;$('importJson').onclick=()=>{$('importFile').click()};$('exportCsv').onclick=exportCSV;$('clearAll').onclick=()=>{if(confirm('确定清空全部账目吗？建议先导出备份。此操作无法撤销。')){records=[];save();closeModal();render()}}}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download(`拾账备份_${todayStr()}.json`,JSON.stringify({app:'拾账',version:1,exportedAt:new Date().toISOString(),records,budget},null,2),'application/json;charset=utf-8')}
function exportCSV(){let rows=[['日期','类型','金额','类别','备注'],...records.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>[r.date,r.type==='income'?'收入':'支出',Number(r.amount).toFixed(2),r.category,r.note||''])];let csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(`拾账账单_${todayStr()}.csv`,csv,'text/csv;charset=utf-8')}
$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.records))throw Error('格式不正确');if(!confirm(`备份中有 ${d.records.length} 条记录。导入将与现有记录合并，重复编号会跳过。继续吗？`))return;let ids=new Set(records.map(r=>r.id));d.records.forEach(r=>{if(r&&r.id&&!ids.has(r.id)&&Number(r.amount)>0&&r.date){records.push(r);ids.add(r.id)}});if(d.budget)budget={...budget,...d.budget};save();render();closeModal();alert('备份导入完成')}catch(err){alert('无法读取该备份文件，请选择拾账导出的 JSON 文件。')}finally{e.target.value=''}};
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p)showPage(p.dataset.page);let g=e.target.closest('[data-goto]');if(g)showPage(g.dataset.goto);let q=e.target.closest('[data-quick]');if(q)openRecord(q.dataset.quick);let ed=e.target.closest('[data-edit]');if(ed){let r=records.find(x=>x.id===ed.dataset.edit);if(r)openRecord(null,r)}let del=e.target.closest('[data-delete]');if(del){let r=records.find(x=>x.id===del.dataset.delete);if(r&&confirm(`删除这笔账目“${r.note||r.category}” ${money(r.amount)}？`)){records=records.filter(x=>x.id!==r.id);save();render()}}});
$('addExpenseHome').onclick=()=>openRecord();$('addRecordBtn').onclick=()=>openRecord();$('editBudgetBtn').onclick=openBudget;$('settingsBtn').onclick=openSettings;$('closeModal').onclick=closeModal;$('modalBack').addEventListener('click',e=>{if(e.target===$('modalBack'))closeModal()});
$('homeMonth').value=monthStr(now);$('recordMonth').value=monthStr(now);
let years=new Set([now.getFullYear()]);records.forEach(r=>{if(r.date)years.add(Number(r.date.slice(0,4)))});for(let y=Math.min(...years);y<=Math.max(...years);y++)years.add(y);$('statsYear').innerHTML=[...years].sort((a,b)=>b-a).map(y=>`<option value="${y}" ${y===now.getFullYear()?'selected':''}>${y}年</option>`).join('');
$('homeMonth').onchange=()=>{renderHome();renderBudget()};$('recordMonth').onchange=renderRecords;$('recordType').onchange=renderRecords;$('recordSearch').oninput=renderRecords;$('statsYear').onchange=renderStats;
load();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
